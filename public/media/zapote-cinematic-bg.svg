<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Paisaje nocturno cinematografico de finca tropical">
  <defs>
    <radialGradient id="moon" cx="68%" cy="18%" r="34%">
      <stop offset="0" stop-color="#f7e7a0" stop-opacity=".78"/>
      <stop offset=".28" stop-color="#a6c66b" stop-opacity=".26"/>
      <stop offset="1" stop-color="#061006" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
